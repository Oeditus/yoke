name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    env:
      XLA_TARGET: cpu
      EXLA_CPU_ONLY: "true"
      NX_DEFAULT_BACKEND: Nx.BinaryBackend
    strategy:
      matrix:
        elixir: ['1.19', '1.20']
        otp: ['29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test --exclude ragex --exclude skip_in_gha
      - name: Run yoke launcher tests
        run: bash test/yoke_release_test.sh
      - name: Run dllb install script tests
        run: bash test/install_dllb_test.sh

  linters:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      XLA_TARGET: cpu
      EXLA_CPU_ONLY: "true"
    strategy:
      matrix:
        elixir: ['1.20']
        otp: ['29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Restore PLT cache
        uses: actions/cache@v3
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Install dependencies
        run: mix deps.get
      - name: Run quality checks
        run: mix quality.ci

  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: [test, linters]
    permissions:
      contents: write
    env:
      # Dedicated Mix env: mix.exs deliberately excludes bumblebee/nx/exla/
      # image (Ragex's embeddings/vector-search/image-processing deps) under
      # this env, since their native NIFs cannot load from inside a
      # `mix escript.build` archive. The regular `mix release` build (e.g.
      # via `MIX_ENV=prod`) keeps those deps and keeps embeddings working.
      MIX_ENV: escript
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-escript-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-escript-
      - name: Install dependencies
        run: mix deps.get

      - name: Verify tag matches mix.exs version
        run: |
          mix eval '
            tag = System.get_env("GITHUB_REF_NAME", "")
            clean_tag = String.trim_leading(tag, "v")
            mix_version = to_string(Mix.Project.config()[:version])
            clean_mix = String.trim_leading(mix_version, "v")

            with {:ok, tag_ver} <- Version.parse(clean_tag),
                 {:ok, mix_ver} <- Version.parse(clean_mix) do
              IO.puts("Tag version:     #{tag} (SemVer: #{tag_ver})")
              IO.puts("mix.exs version: #{mix_version} (SemVer: #{mix_ver})")

              if Version.compare(tag_ver, mix_ver) == :eq do
                IO.puts("✓ Tag #{tag} matches mix.exs version #{mix_version}")
              else
                IO.puts("::error::Tag #{tag} does not match mix.exs version #{mix_version}. Bump mix.exs before tagging.")
                System.halt(1)
              end
            else
              :error ->
                IO.puts("::error::Failed to parse SemVer: tag=#{inspect(tag)} mix.exs=#{inspect(mix_version)}")
                System.halt(1)
              end
          '

      - name: Build yoke escript
        run: |
          mix escript.build
          mv yoke_escript yoke

      - name: Compute checksum
        run: sha256sum yoke > yoke.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yoke
            yoke.sha256
          generate_release_notes: true
