name: 'Yoke Review'
description: 'Review a pull request with yoke, headlessly, and annotate the diff'
author: 'Oeditus'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  command:
    description: 'Subcommand to run (review, lint, describe, run, audit, rag).'
    required: false
    default: 'review'
  base:
    description: 'Base revision to review or describe from. Defaults to the PR base SHA.'
    required: false
    default: ''
  head:
    description: 'Head revision to review or describe to. Defaults to the PR head SHA.'
    required: false
    default: ''
  pr:
    description: 'Pull request number. Defaults to the PR that triggered the workflow.'
    required: false
    default: ''
  provider:
    description: 'Provider profile name (e.g. deepseek, local, local-qwen).'
    required: false
    default: ''
  model:
    description: 'Model identifier to use for review, describe, or run.'
    required: false
    default: ''
  endpoint:
    description: 'Chat-completions endpoint URL.'
    required: false
    default: ''
  fail-on:
    description: >
      Severity threshold that fails the job: high, medium, low, info, or never.
      Defaults to high on pull_request and never on push.
    required: false
    default: ''
  format:
    description: 'Output format: summary, markdown, or json.'
    required: false
    default: ''
  max-cost:
    description: 'Hard USD budget for review or describe.'
    required: false
    default: ''
  max-diff-bytes:
    description: 'Override the review or describe diff cap in bytes (default 300000).'
    required: false
    default: ''
  dry-run:
    description: 'Resolve review context and exit without calling the model.'
    required: false
    default: 'false'
  post:
    description: >
      Post the review to the pull request as inline comments. Requires
      `pull-requests: write` permission on the workflow token.
    required: false
    default: 'true'
  with-ragex:
    description: >
      Enable Ragex code intelligence (slower; requires a cache). When true,
      dllb-server and the .ragex/.yoke caches are wired up as well.
    required: false
    default: 'false'
  dllb-version:
    description: >
      dllb-server release tag to install, e.g. v1.0.2. Defaults to the latest
      release, refreshed daily when cached. Set to 'skip' to install nothing.
    required: false
    default: ''
  upload:
    description: 'Upload the review artifact at the end of the run.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact. Defaults to yoke-<command>.'
    required: false
    default: ''
  yoke-version:
    description: >
      yoke release tag to install, e.g. v0.21.1. Defaults to the latest release,
      refreshed daily when cached.
    required: false
    default: ''
  build-from-source:
    description: >
      Build the escript from the checked-out tree instead of downloading a
      release. Use for dogfooding: a released binary may predate the command
      under test, which makes a passing run meaningless.
    required: false
    default: 'false'
  elixir-version:
    description: 'Elixir version to install.'
    required: false
    default: '1.20'
  otp-version:
    description: 'Erlang/OTP version to install.'
    required: false
    default: '29'

outputs:
  findings-count:
    description: 'Number of issues found (endorsements excluded).'
    value: ${{ steps.review.outputs.findings-count }}
  max-severity:
    description: 'Highest issue severity found, or "none".'
    value: ${{ steps.review.outputs.max-severity }}
  run-uid:
    description: 'Stable identifier for this review run.'
    value: ${{ steps.review.outputs.run-uid }}
  report-path:
    description: 'Path to the JSON artifact describing the run.'
    value: ${{ steps.review.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Install Elixir and Erlang
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}

    - name: Prepare binary cache keys
      id: binary-cache
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_YOKE_VERSION: ${{ inputs.yoke-version }}
        INPUT_DLLB_VERSION: ${{ inputs.dllb-version }}
      run: |
        set -euo pipefail
        sha256_file() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$1" | awk '{print $1}'
          else
            echo "::error::Neither sha256sum nor shasum is available"
            exit 1
          fi
        }

        day="$(date -u +%F)"
        yoke_key="${INPUT_YOKE_VERSION:-}"
        if [ -z "$yoke_key" ] || [ "$yoke_key" = "latest" ]; then
          yoke_key="latest-$day"
        fi
        dllb_key="${INPUT_DLLB_VERSION:-}"
        if [ -z "$dllb_key" ] || [ "$dllb_key" = "latest" ]; then
          dllb_key="latest-$day"
        fi

        {
          echo "day=$day"
          echo "yoke-key=$yoke_key"
          echo "dllb-key=$dllb_key"
          echo "yoke-installer=$(sha256_file "$ACTION_PATH/scripts/install.sh")"
          echo "dllb-installer=$(sha256_file "$ACTION_PATH/scripts/install-dllb.sh")"
        } >> "$GITHUB_OUTPUT"

    - name: Restore yoke binary
      # Source builds must never be satisfied by a downloaded release cache.
      id: yoke-cache
      if: ${{ inputs.build-from-source != 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.local/bin/yoke
        key: yoke-binary-v1-${{ runner.os }}-${{ runner.arch }}-otp${{ inputs.otp-version }}-elixir${{ inputs.elixir-version }}-${{ steps.binary-cache.outputs.yoke-installer }}-${{ steps.binary-cache.outputs.yoke-key }}

    - name: Install yoke
      id: install
      if: ${{ inputs.build-from-source == 'true' || steps.yoke-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        YOKE_VERSION: ${{ inputs.yoke-version }}
        BUILD_FROM_SOURCE: ${{ inputs.build-from-source }}
      run: |
        set -euo pipefail

        if [ "$BUILD_FROM_SOURCE" = "true" ]; then
          # Build the escript from the checked-out tree. Used for dogfooding:
          # the released binary may predate the command being tested, which
          # makes a "passing" run meaningless.
          echo "Building yoke from source…"
          MIX_ENV=escript mix deps.get
          MIX_ENV=escript mix escript.build
          # `install.sh` creates this directory; the source path must too.
          mkdir -p "$HOME/.local/bin"
          install -m 0755 yoke_escript "$HOME/.local/bin/yoke"
        else
          "$ACTION_PATH/scripts/install.sh"
        fi

    - name: Add installed binaries to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Restore dllb binary
      id: dllb-cache
      if: ${{ inputs.with-ragex == 'true' && inputs.dllb-version != 'skip' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.local/bin/dllb-server
        key: dllb-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-cache.outputs.dllb-installer }}-${{ steps.binary-cache.outputs.dllb-key }}

    # Ragex's per-project store backend spawns a `dllb-server` OS process
    # against `<repo>/.ragex/dllb.redb`. That binary is a Rust executable and
    # is not part of the Elixir dependency tree, so without this step every
    # run logs `:dllb_binary_not_found` and falls back to the ETS backend.
    # The installer never fails the job on its own: dllb is an accelerator.
    - name: Install dllb-server
      id: dllb
      if: ${{ inputs.with-ragex == 'true' && inputs.dllb-version != 'skip' && steps.dllb-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        DLLB_VERSION: ${{ inputs.dllb-version }}
      run: |
        set -euo pipefail
        "$ACTION_PATH/scripts/install-dllb.sh"

    # `.ragex` holds the Ragex knowledge graph (dllb.redb) and `.yoke` holds
    # the repo's config, policy and session checkpoints. Restoring them turns
    # a 2-4 minute cold index into a warm start. Both are keyed on the sources
    # they describe, so a stale graph is never reused after a code change.
    - name: Restore Ragex and yoke caches
      if: ${{ inputs.with-ragex == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .ragex
          .yoke
          !.ragex/**/dllb.instance.json
          !.ragex/**/*.sock
        # v2 must not restore old archives containing runner-local PIDs/ports.
        key: ${{ runner.os }}-ragex-v2-${{ hashFiles('**/*.ex', '**/*.exs', 'mix.lock', '.yoke/config.json', '.yoke/policy.json') }}
        restore-keys: |
          ${{ runner.os }}-ragex-v2-

    - name: Resolve review range
      id: range
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_PR: ${{ inputs.pr }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
      run: |
        set -euo pipefail

        pr="${INPUT_PR:-$PR_NUMBER}"
        base="${INPUT_BASE:-$PR_BASE_SHA}"
        head="${INPUT_HEAD:-$PR_HEAD_SHA}"

        # On a push event there is no PR; review the pushed range instead.
        if [ -z "$base" ] && [ "$EVENT_NAME" = "push" ]; then
          base="$PUSH_BEFORE"
          head="$PUSH_AFTER"
        fi

        echo "pr=$pr"       >> "$GITHUB_OUTPUT"
        echo "base=$base"   >> "$GITHUB_OUTPUT"
        echo "head=$head"   >> "$GITHUB_OUTPUT"

    - name: Run yoke ${{ inputs.command }}
      id: review
      shell: bash
      env:
        # `gh` is preinstalled on GitHub-hosted runners and reads this.
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MAX_COST: ${{ inputs.max-cost }}
        INPUT_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_POST: ${{ inputs.post }}
        INPUT_WITH_RAGEX: ${{ inputs.with-ragex }}
        REVIEW_PR: ${{ steps.range.outputs.pr }}
        REVIEW_BASE: ${{ steps.range.outputs.base }}
        REVIEW_HEAD: ${{ steps.range.outputs.head }}
      run: |
        set -uo pipefail

        case "$INPUT_COMMAND" in
          review|lint|describe|run|audit|rag) ;;
          *)
            echo "::error title=Invalid yoke command::unsupported command '$INPUT_COMMAND' (expected review, lint, describe, run, audit, or rag)"
            exit 2
            ;;
        esac

        if ! command -v jq >/dev/null 2>&1; then
          echo "::error title=Missing dependency::jq is required on the runner to parse yoke output"
          exit 3
        fi

        args=("$INPUT_COMMAND")
        expect_report=true

        # Build flags per subcommand so strict OptionParser switches never fail
        # on flags that only apply to `review` or `describe`.
        case "$INPUT_COMMAND" in
          review)
            [ -n "$REVIEW_BASE" ]          && args+=(--base "$REVIEW_BASE")
            [ -n "$REVIEW_HEAD" ]          && args+=(--head "$REVIEW_HEAD")
            [ -n "$REVIEW_PR" ]            && args+=(--pr "$REVIEW_PR")
            [ -n "$INPUT_PROVIDER" ]       && args+=(--provider "$INPUT_PROVIDER")
            [ -n "$INPUT_MODEL" ]          && args+=(--model "$INPUT_MODEL")
            [ -n "$INPUT_ENDPOINT" ]       && args+=(--endpoint "$INPUT_ENDPOINT")
            [ -n "$INPUT_FAIL_ON" ]        && args+=(--fail-on "$INPUT_FAIL_ON")
            [ -n "$INPUT_FORMAT" ]         && args+=(--format "$INPUT_FORMAT")
            [ -n "$INPUT_MAX_COST" ]       && args+=(--max-cost "$INPUT_MAX_COST")
            [ -n "$INPUT_MAX_DIFF_BYTES" ] && args+=(--max-diff-bytes "$INPUT_MAX_DIFF_BYTES")
            [ "$INPUT_DRY_RUN" = "true" ]  && args+=(--dry-run)
            [ "$INPUT_POST" = "true" ]     && args+=(--post)
            ;;
          describe)
            [ -n "$REVIEW_BASE" ]          && args+=(--base "$REVIEW_BASE")
            [ -n "$REVIEW_HEAD" ]          && args+=(--head "$REVIEW_HEAD")
            [ -n "$REVIEW_PR" ]            && args+=(--pr "$REVIEW_PR")
            [ -n "$INPUT_PROVIDER" ]       && args+=(--provider "$INPUT_PROVIDER")
            [ -n "$INPUT_MODEL" ]          && args+=(--model "$INPUT_MODEL")
            [ -n "$INPUT_ENDPOINT" ]       && args+=(--endpoint "$INPUT_ENDPOINT")
            [ -n "$INPUT_FAIL_ON" ]        && args+=(--fail-on "$INPUT_FAIL_ON")
            [ -n "$INPUT_FORMAT" ]         && args+=(--format "$INPUT_FORMAT")
            [ -n "$INPUT_MAX_COST" ]       && args+=(--max-cost "$INPUT_MAX_COST")
            [ -n "$INPUT_MAX_DIFF_BYTES" ] && args+=(--max-diff-bytes "$INPUT_MAX_DIFF_BYTES")
            ;;
          lint|audit)
            [ -n "$INPUT_FAIL_ON" ]        && args+=(--fail-on "$INPUT_FAIL_ON")
            [ -n "$INPUT_FORMAT" ]         && args+=(--format "$INPUT_FORMAT")
            ;;
          run)
            [ -n "$INPUT_PROVIDER" ]       && args+=(--provider "$INPUT_PROVIDER")
            [ -n "$INPUT_FAIL_ON" ]        && args+=(--fail-on "$INPUT_FAIL_ON")
            [ -n "$INPUT_FORMAT" ]         && args+=(--format "$INPUT_FORMAT")
            ;;
          rag)
            [ -n "$INPUT_FAIL_ON" ]        && args+=(--fail-on "$INPUT_FAIL_ON")
            [ -n "$INPUT_FORMAT" ]         && args+=(--format "$INPUT_FORMAT")
            expect_report=false
            ;;
        esac

        export YOKE_WITH_RAGEX="$INPUT_WITH_RAGEX"

        report="${RUNNER_TEMP:-/tmp}/yoke-${INPUT_COMMAND}.json"
        args+=(--output "$report")

        # `yoke` writes the step summary and annotations itself. Capture the
        # exit status rather than letting `set -e` abort, so the outputs below
        # are always populated even on a gating failure.
        set +e
        yoke "${args[@]}"
        status=$?
        set -e

        {
          if [ -f "$report" ]; then
            echo "report-path=$report"
            echo "findings-count=$(jq -r '.summary.findings_count // 0' "$report")"
            echo "max-severity=$(jq -r '.summary.max_severity // "none"' "$report")"
            echo "run-uid=$(jq -r '.run_uid // ""' "$report")"
          else
            echo "report-path="
            echo "findings-count=0"
            echo "max-severity=none"
            echo "run-uid="
          fi
        } >> "$GITHUB_OUTPUT"

        # Fail the step when `yoke` failed. Without this the job passes on any
        # non-zero exit -- including a usage error or a missing binary -- and
        # "green" means nothing. Exit 1 (findings at or above --fail-on) is a
        # legitimate gating outcome, so it is reported but not treated as an
        # infrastructure failure.
        if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
          echo "::error title=yoke $INPUT_COMMAND failed::exit status $status"
          exit "$status"
        fi

        if [ "$expect_report" = "true" ] && [ ! -f "$report" ]; then
          echo "::error title=yoke $INPUT_COMMAND produced no artifact::expected $report"
          exit 3
        fi

        exit "$status"

    # Guarded on a non-empty path: when the run step fails before writing its
    # outputs, `report-path` is unset and upload-artifact errors with
    # "Input required and not supplied: path", masking the real failure.
    - name: Upload review artifact
      if: ${{ always() && inputs.upload == 'true' && steps.review.outputs.report-path != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name || format('yoke-{0}', inputs.command) }}
        path: ${{ steps.review.outputs.report-path }}
        if-no-files-found: warn
        retention-days: 14
